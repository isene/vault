[package]
name = "vault"
version = "0.5.0"
edition = "2021"
description = "Passwords in one encrypted file: a terminal program to find, copy and change them, and the library gaze and the phone read the same file with"
license = "Unlicense"
repository = "https://github.com/isene/vault"
authors = ["Geir Isene <g@isene.com>"]

[lib]
name = "vault"
path = "src/lib.rs"

[[bin]]
name = "vault"
path = "src/main.rs"
required-features = ["tui"]

[features]
default = ["tui"]
# The terminal program. gaze and the phone take the library alone.
tui = ["dep:crust", "dep:x11rb", "dep:libc", "dep:aes", "dep:cbc", "dep:pbkdf2", "dep:hmac", "dep:sha2", "dep:base64"]

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crust = { version = "0.1", path = "../crust", package = "fe2o3-crust", optional = true }
# The clipboard helper owns the selection itself, so it can let go of it.
x11rb = { version = "0.13", default-features = false, optional = true }
libc = { version = "0.2", optional = true }
# Reading an outline scribe sealed, for --import-hl.
aes = { version = "0.8", optional = true }
cbc = { version = "0.1", features = ["block-padding", "alloc"], optional = true }
pbkdf2 = { version = "0.12", default-features = false, optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
